<!DOCTYPE html>
<html lang="en">
<head>


<meta name="generator" content="Perplexity Computer">
<meta name="author" content="Perplexity Computer">
<meta property="og:see_also" content="https://www.perplexity.ai/computer">
<link rel="author" href="https://www.perplexity.ai/computer">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-Eye Traffic Command Center — Reset Password</title>

<link rel="stylesheet" href="/fontawesome-free-7.2.0-web/fontawesome-free-7.2.0-web/css/all.min.css">
<link rel="stylesheet" href="css/style.css">

</head>
<body>

<div class="login-page">
  <div class="login-bg">
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="/assets/videos/A-eye.mp4" type="video/mp4">
    </video>

  <div class="login-header">
    <div class="login-header-logo">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-label="A-Eye Logo">
        <rect x="2" y="2" width="28" height="28" rx="6" fill="rgba(61,90,254,0.15)" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
        <circle cx="16" cy="14" r="5" stroke="rgba(255,255,255,0.9)" stroke-width="1.8" fill="none"/>
        <circle cx="16" cy="14" r="1.8" fill="rgba(61,90,254,0.9)"/>
        <path d="M8 24 L16 20 L24 24" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="login-header-title">A-Eye Traffic Command Center — Alexandria</span>
    </div>
  </div>

  <div class="login-center">
    <div class="login-card">
      <div class="login-icon">
        <div class="icon">
          <i class="fa-solid fa-shield-halved fs-2 text-muted"></i>
        </div>
      </div>
      <h1 class="login-card-title">Reset Password</h1>
      <p class="login-card-subtitle">Follow the steps to reset your password securely</p>

      <form id="requestStep" class="login-form">
        <div class="form-group">
          <label class="form-label" for="serviceId">Service ID</label>
          <input class="form-input" type="text" id="serviceId" placeholder="Enter your service ID" autocomplete="username">
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-input" type="email" id="email" placeholder="Enter your email" autocomplete="email">
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          <i class="fa-solid fa-paper-plane"></i>
          Send Reset Code
        </button>
      </form>

      <form id="verifyStep" class="login-form hidden">
        <div class="form-group">
          <label class="form-label" for="resetCode">Reset Code</label>
          <input class="form-input" type="text" id="resetCode" placeholder="Enter the 6-digit code" inputmode="numeric" maxlength="6" required>
          <p class="text-muted text-sm" style="margin-top:8px;">Code expires in <span id="codeCountdown">05:00</span></p>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          <i class="fa-solid fa-circle-check"></i>
          Verify Code
        </button>
      </form>

      <form id="resetStep" class="login-form hidden">
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input class="form-input" type="password" id="newPassword" placeholder="Create a new password" autocomplete="new-password" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password</label>
          <input class="form-input" type="password" id="confirmPassword" placeholder="Confirm your new password" autocomplete="new-password" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full btn-lg">
          <i class="fa-solid fa-key"></i>
          Update Password
        </button>
      </form>

      <div style="margin-top:16px;text-align:center;">
        <a href="index.html" class="text-muted">Back to sign in</a>
      </div>
    </div>
  </div>
</div>

<div id="snackbar" class="snackbar"></div>

<script src="./forgot-password.js"></script>

</body>
</html>
